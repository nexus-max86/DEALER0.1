<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#007782">
<title>Pas de connexion · DEALER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F5F7F7; color: #002730; text-align: center; }
  .carte { max-width: 380px; width: 100%; background: #fff; border: 1px solid #D8DEDF; border-radius: 16px; padding: 32px 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.55; color: #60797E; margin-bottom: 24px; }
  button { width: 100%; padding: 14px 20px; border: none; border-radius: 999px; background: #007782; color: #fff;
    font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
  <div class="carte">
    <img src="/icons/icon-192.png" alt="DEALER">
    <h1>Pas de connexion internet</h1>
    <p>Vérifie ton réseau ou tes données mobiles. DEALER se recharge dès que la connexion revient.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
